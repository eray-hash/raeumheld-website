<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Räumheld — derzeit nicht aktiv</title>
<meta name="description" content="Räumheld ist derzeit nicht operativ. Wir nehmen aktuell keine Aufträge an.">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://www.raeumheld.de/">
<meta name="theme-color" content="#1A3A5C">
<link rel="icon" type="image/jpeg" href="raeumheld-logo.jpg">
<link rel="apple-touch-icon" href="raeumheld-logo.jpg">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #F6F4EF;
    color: #1A2733;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    line-height: 1.6;
  }
  .card {
    max-width: 560px;
    width: 100%;
    background: #FFFFFF;
    border-radius: 16px;
    padding: 40px 32px;
    box-shadow: 0 2px 24px rgba(26, 58, 92, 0.08);
    text-align: center;
  }
  .logo {
    width: 96px;
    height: 96px;
    object-fit: contain;
    margin: 0 auto 24px;
    display: block;
    border-radius: 12px;
  }
  h1 {
    font-size: 28px;
    line-height: 1.2;
    color: #1A3A5C;
    margin: 0 0 12px;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .lead {
    font-size: 17px;
    color: #3D4B5A;
    margin: 0 0 8px;
  }
  .sub {
    font-size: 15px;
    color: #6B7684;
    margin: 0 0 32px;
  }
  .footer-links {
    border-top: 1px solid #E8E5DE;
    padding-top: 20px;
    font-size: 14px;
    color: #6B7684;
  }
  .footer-links a {
    color: #1A3A5C;
    text-decoration: none;
    margin: 0 10px;
  }
  .footer-links a:hover { text-decoration: underline; }
  @media (max-width: 480px) {
    .card { padding: 32px 20px; }
    h1 { font-size: 24px; }
  }
</style>
</head>
<body>
<main class="card">
  <img src="raeumheld-logo.jpg" alt="Räumheld" class="logo">
  <h1>Räumheld ist derzeit nicht aktiv</h1>
  <p class="lead">Wir nehmen aktuell keine Aufträge an und stehen für Anfragen nicht zur Verfügung.</p>
  <p class="sub">Vielen Dank für Ihr Verständnis.</p>
  <nav class="footer-links">
    <a href="impressum.html">Impressum</a>
    <a href="datenschutz.html">Datenschutz</a>
  </nav>
</main>
</body>
</html>
